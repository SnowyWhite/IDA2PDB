<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Source of pipeline.png (docs/design.md). Re-render it after editing; see docs/development.md. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #4a5568; stroke-width: 2; rx: 10; }
      .ida { fill: #eef4ff; stroke: #3b6fd8; }
      .data { fill: #f5f7fa; }
      .out { fill: #edf9f0; stroke: #2f9e5b; }
      .title { font-size: 20px; font-weight: 600; fill: #1a202c; }
      .text { font-size: 15px; fill: #4a5568; }
      .code { font-family: Consolas, Menlo, monospace; font-size: 14px; fill: #2d3748; }
      .step { font-size: 15px; font-weight: 600; fill: #2d3748; }
      .line { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .zone { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="460" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="20" y="20" width="390" height="420" rx="14" fill="#f3f7ff" stroke="#c7d7f7" stroke-dasharray="6 5"/>
  <text x="215" y="48" text-anchor="middle" class="zone" fill="#3b6fd8">NEEDS IDA</text>
  <rect x="425" y="20" width="755" height="420" rx="14" fill="#fafafa" stroke="#e2e8f0" stroke-dasharray="6 5"/>
  <text x="802" y="48" text-anchor="middle" class="zone" fill="#718096">NEEDS NO IDA</text>

  <!-- IDA database -->
  <rect x="45" y="150" width="220" height="110" class="box ida"/>
  <text x="155" y="190" text-anchor="middle" class="title">IDA database</text>
  <text x="155" y="216" text-anchor="middle" class="text">names, functions,</text>
  <text x="155" y="236" text-anchor="middle" class="text">types you assigned</text>

  <!-- Snapshot -->
  <rect x="445" y="150" width="180" height="110" class="box data"/>
  <text x="535" y="190" text-anchor="middle" class="title">Snapshot</text>
  <text x="535" y="216" text-anchor="middle" class="text">portable JSON</text>
  <text x="535" y="236" text-anchor="middle" class="code">app.symbols.json</text>

  <!-- Writer input -->
  <rect x="700" y="150" width="200" height="110" class="box data"/>
  <text x="800" y="190" text-anchor="middle" class="title">Writer input</text>
  <text x="800" y="216" text-anchor="middle" class="text">CodeView type records,</text>
  <text x="800" y="236" text-anchor="middle" class="text">placed symbols</text>

  <!-- PDB -->
  <rect x="975" y="150" width="185" height="110" class="box out"/>
  <text x="1067" y="190" text-anchor="middle" class="title">PDB</text>
  <text x="1067" y="216" text-anchor="middle" class="text">for WinDbg, x64dbg,</text>
  <text x="1067" y="236" text-anchor="middle" class="text">Visual Studio</text>

  <!-- Executable -->
  <rect x="700" y="340" width="200" height="80" class="box"/>
  <text x="800" y="375" text-anchor="middle" class="title">Executable</text>
  <text x="800" y="400" text-anchor="middle" class="text">sections, GUID and age</text>

  <!-- Arrows and steps -->
  <path d="M265,205 L443,205" class="line"/>
  <text x="335" y="178" text-anchor="middle" class="step">1. collect</text>
  <text x="335" y="232" text-anchor="middle" class="code">ida_collect.py</text>

  <path d="M625,205 L698,205" class="line"/>
  <text x="662" y="128" text-anchor="middle" class="step">2. lower</text>
  <text x="662" y="146" text-anchor="middle" class="code">codeview.py</text>

  <path d="M900,205 L973,205" class="line"/>
  <text x="937" y="110" text-anchor="middle" class="step">3. write</text>
  <text x="937" y="128" text-anchor="middle" class="code">ida2pdb-pdbgen</text>
  <text x="937" y="146" text-anchor="middle" class="text">(LLVM)</text>

  <path d="M700,380 C660,380 662,300 662,212" class="line"/>
  <path d="M900,380 C935,380 937,300 937,212" class="line"/>
  <text x="575" y="330" text-anchor="middle" class="text">checks identity,</text>
  <text x="575" y="350" text-anchor="middle" class="text">places symbols</text>
  <text x="1040" y="330" text-anchor="middle" class="text">copies sections,</text>
  <text x="1040" y="350" text-anchor="middle" class="text">GUID and age</text>
</svg>
