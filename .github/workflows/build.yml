# Tests the code and builds the release files. Runs on every push and pull
# request, and is reused by release.yml to publish a release.
#
name: Build

on:
  push:
    branches: ["**"]  # tags go through release.yml
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the package version comes from the git tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LLVM, Clang and lld (MSYS2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld

      - name: Use MSYS2's LLVM
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "LLVM_CONFIG=${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\llvm-config.exe"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build the static writer
        run: python -m ida2pdb build-writer --static -o dist/ida2pdb-pdbgen.exe

      - name: Build the IDA plugin archive, with the writer
        run: python tools/package_plugin.py dist/ida2pdb.zip --writer dist/ida2pdb-pdbgen.exe

      - name: Build the Python package
        run: |
          python -m pip install build
          python -m build --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    env:
      LLVM_CONFIG: /usr/lib/llvm-18/bin/llvm-config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install LLVM, Clang and lld
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends llvm-18-dev clang-18 lld-18

      - name: Test
        run: python -m unittest discover -s tests -v
