# Publishes a GitHub release when a tag such as v1.2.0 is pushed:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The release gets the IDA plugin archive (with a prebuilt writer), 
# the standalone writer for Windows, and the Python package.
#
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
